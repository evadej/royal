{% extends "base.html" %}
{% block title %}{{ t.register_title }} - Royal Casino{% endblock %}
{% block content %}
  <div class="card" style="max-width:420px;margin:60px auto;">
      <div class="card-header"><h2 class="card-title">{{ t.register_header }}</h2></div>
    <form method="POST" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
          <label class="label" for="username">{{ t.username }}</label>
          <input class="input" id="username" name="username" minlength="3" required>
          <div class="muted" style="font-size:12px;margin-top:4px;">{{ t.username_hint }}</div>
      </div>
      <div class="form-group">
          <label class="label" for="password">{{ t.password }}</label>
          <input class="input" type="password" id="password" name="password" minlength="4" required>
          <div class="muted" style="font-size:12px;margin-top:4px;">{{ t.password_hint }}</div>
      </div>
      <div class="form-group">
          <label class="label" for="code">{{ t.code_label }}</label>
          <input class="input" id="code" name="code" value="{{ ref_code }}" placeholder="{{ t.code_placeholder }}">
      </div>
        <button class="btn" style="width:100%"><i class="fas fa-user-plus"></i> {{ t.register_button }}</button>
    </form>
      <p class="muted" style="margin-top:12px;text-align:center;">{{ t.have_account }} <a class="link" href="{{ url_for('login') }}">{{ t.login_here }}</a></p>
  </div>
{% endblock %}
