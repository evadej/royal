{% extends "base.html" %}
{% block title %}{{ t.login_page_title }} - Royal Casino{% endblock %}
{% block content %}
  <div class="card" style="max-width:420px;margin:60px auto;">
      <div class="card-header"><h2 class="card-title">{{ t.login_header }}</h2></div>
    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
          <label class="label" for="username">{{ t.username }}</label>
        <input class="input" id="username" name="username" required>
      </div>
      <div class="form-group">
          <label class="label" for="password">{{ t.password }}</label>
        <input class="input" type="password" id="password" name="password" required>
      </div>
        <button class="btn" style="width:100%"><i class="fas fa-sign-in-alt"></i> {{ t.login_button }}</button>
    </form>
    <p class="muted" style="margin-top:12px;text-align:center;">
        {{ t.no_account }} <a class="link" href="{{ url_for('register') }}">{{ t.register_here }}</a>
    </p>
  </div>
{% endblock %}
